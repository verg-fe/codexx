<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151a20"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
  <title>Huihui · 手机工作台</title>
  <style>
    :root{color-scheme:dark;--bg:#101317;--panel:#191f27;--line:#2a333e;--text:#e8edf2;--muted:#9aa7b5;--accent:#b9f176;--warn:#ffc46b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,"Microsoft YaHei UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:760px;margin:auto;padding:18px 0 42px}header{display:flex;align-items:center;gap:12px;margin:8px 0 20px}.mark{width:42px;height:42px;border-radius:14px;background:#273426;display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:22px}h1{font-size:21px;margin:0}header small{color:var(--muted)}section,.job{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}label{display:block;color:var(--muted);font-size:14px;margin-bottom:7px}input,textarea{width:100%;border:1px solid var(--line);background:#11161c;color:var(--text);border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}input[type=file]{padding:10px}button{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#182016;font-weight:700;font-size:15px;width:100%;margin-top:12px}button.secondary{background:#303944;color:var(--text)}button:disabled{opacity:.55}.hint{font-size:13px;line-height:1.5;color:var(--muted);margin:10px 0 0}.job-head{display:flex;justify-content:space-between;gap:12px}.job-title{font-weight:650;overflow-wrap:anywhere}.badge{font-size:12px;padding:4px 8px;border-radius:99px;background:#303944;white-space:nowrap}.queued,.completed{color:var(--accent)}.failed,.needs_review{color:var(--warn)}.files{color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px;overflow-wrap:anywhere}.result{margin-top:10px;padding:10px;background:#11161c;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.job button{width:auto;padding:8px 12px;font-size:13px}.hide{display:none!important}.err{color:#ff9d91;margin-top:8px;white-space:pre-wrap}.ok{color:var(--accent)}.row{display:flex;gap:8px}.row button{flex:1}
  </style>
</head>
<body><main>
  <header><div class="mark">H</div><div><h1>Huihui 手机工作台</h1><small>文件留在本机 G 盘 · 仅通过你的 Tailscale 网络访问</small></div></header>
  <section id="login"><label for="code">桌面端显示的接入码</label><input id="code" type="password" autocomplete="current-password" placeholder="输入接入码"><div class="row"><button id="saveCode">连接</button><button class="secondary" id="forget">清除接入码</button></div><p class="hint">接入码只保存在这台手机的浏览器中。请勿把工作链接或接入码转发给他人。</p></section>
  <div id="app" class="hide">
    <section><label for="task">告诉 Huihui 要处理什么</label><textarea id="task" maxlength="10000" placeholder="例如：把这几张图片统一缩小到 1600 像素宽并保存到本轮输出目录。"></textarea><label for="reasoningEffort" style="margin-top:13px">思考模式</label><select id="reasoningEffort" style="width:100%;border:1px solid var(--line);background:#11161c;color:var(--text);border-radius:10px;padding:12px;font:inherit" aria-describedby="effortHint"><option value="low">快速思考 · 简单任务</option><option value="medium" selected>均衡思考 · 推荐</option><option value="xhigh">深入思考 · 复杂任务</option></select><p id="effortHint" class="hint">控制本轮推理力度；不会减少任务文字、附件或 MCP 工具说明。</p><label for="files" style="margin-top:13px">选择文件</label><input id="files" type="file" multiple><p class="hint">支持常见文档、图片、音频、视频、压缩包和源代码；单个文件最大 250 MiB。附件作为数据交给 Huihui，任务会在桌面空闲后开始。</p><button id="submit">上传并交给 Huihui</button><div id="sendState" class="hint"></div><div id="sendError" class="err"></div></section>
    <h2 style="font-size:17px;margin:20px 4px 8px">任务进度</h2><div id="jobs"></div>
  </div>
</main>
<script>
const base=new URL('.',location.href),api=(p)=>new URL('api/'+p,base).toString(),$=id=>document.getElementById(id);let token=localStorage.getItem('huihui-access-code')||'';
function auth(){return {'Authorization':'Bearer '+token}}
function show(){ $('login').classList.toggle('hide',!!token);$('app').classList.toggle('hide',!token);if(token)refresh() }
$('saveCode').onclick=()=>{token=$('code').value.trim();if(!token)return;$('code').value='';localStorage.setItem('huihui-access-code',token);show()};$('forget').onclick=()=>{token='';localStorage.removeItem('huihui-access-code');show()};
async function request(url,opts={}){const r=await fetch(url,{...opts,headers:{...auth(),...(opts.headers||{})}});const d=await r.json().catch(()=>({error:'服务器返回无法识别的响应'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
$('submit').onclick=async()=>{const task=$('task').value.trim(),files=[...$('files').files];$('sendError').textContent='';if(!task){$('sendError').textContent='先写清楚要处理什么。';return}if(!files.length){$('sendError').textContent='请至少选择一个文件。';return}const b=$('submit');b.disabled=true;try{$('sendState').textContent='正在创建任务…';const job=await request(api('jobs'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,reasoning_effort:$('reasoningEffort').value})});for(let i=0;i<files.length;i++){const f=files[i];if(f.size>250*1024*1024)throw Error(f.name+' 超过 250 MiB。');$('sendState').textContent=`上传 ${i+1}/${files.length}：${f.name}`;await request(api(`jobs/${job.id}/files/${encodeURIComponent(f.name)}`),{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body:f})}await request(api(`jobs/${job.id}/submit`),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});$('task').value='';$('files').value='';$('sendState').textContent='已加入队列 · '+({'low':'快速思考','medium':'均衡思考','xhigh':'深入思考'}[reasoning_effort])+ '；Huihui 会在桌面空闲后处理。';await refresh()}catch(e){$('sendError').textContent=e.message;$('sendState').textContent=''}finally{b.disabled=false}};
async function cancel(id){try{await request(api(`jobs/${id}/cancel`),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await refresh()}catch(e){alert(e.message)}}
async function refresh(){try{const d=await request(api('jobs'));$('jobs').innerHTML=d.jobs.map(j=>`<article class="job"><div class="job-head"><div class="job-title">${esc(j.task)}</div><span class="badge ${esc(j.status)}">${esc(j.progress||j.status)}</span></div><div class="files">${(j.files||[]).map(esc).join(' · ')||'无附件'}</div>${j.result?`<div class="result">${esc(j.result)}</div>`:''}${['queued','uploading','processing','needs_review'].includes(j.status)?`<button class="secondary" data-cancel="${esc(j.id)}">取消 / 标记需复核</button>`:''}</article>`).join('')||'<p class="hint">还没有手机任务。</p>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancel))}catch(e){if(e.message.includes('接入码')){token='';localStorage.removeItem('huihui-access-code');show()}else $('jobs').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
show();if(token)setInterval(refresh,4000);if('serviceWorker'in navigator)navigator.serviceWorker.register(new URL('sw.js',base)).catch(()=>{});
</script></body></html>
